  <script>
    // 复制查询链接（navigator.clipboard + execCommand 兜底）
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-copy]');
      if (!btn) return;
      var text = btn.getAttribute('data-copy');
      var ok = function () { var t = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(function () { btn.textContent = t; }, 1500); };
      var fallback = function () {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand('copy'); ok(); } catch (err) { btn.textContent = '请长按链接手动复制'; }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, fallback);
      } else { fallback(); }
    });
  </script>
