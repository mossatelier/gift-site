      <div class="guide-step"><span class="guide-step-no">1</span><span class="guide-step-text">扫邀请码 / 联系客服，填写办卡资料。</span></div>
      <div class="guide-step"><span class="guide-step-no">2</span><span class="guide-step-text">审批通过后，在规定时间内去银行完成激活、首刷。</span></div>

      <div class="guide-step"><span class="guide-step-no">4</span><span class="guide-step-text">需新户参与，满 6 个月后方可注销。</span></div>
      <div class="guide-step"><span class="guide-step-no">5</span><span class="guide-step-text">所有卡片第一年免年费，刷 6-12 笔（不限金额）即可免次年年费。</span></div>
    </div>

    <div class="guide-note">温馨提示：具体激活时限、首刷要求以各银行规定为准，如有疑问请联系客服。</div>
